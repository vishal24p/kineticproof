[project]
name = "kineticproof-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "opencv-contrib-python-headless>=4.13.0.92,<4.14",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
